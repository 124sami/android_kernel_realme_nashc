name: Build nashc kernel

on:
  workflow_dispatch:
    inputs:
      lto:
        description: "Keep CONFIG_LTO_CLANG (turn off if the job runs out of memory)"
        type: boolean
        default: true
      force_load:
        description: "Enable CONFIG_MODULE_FORCE_LOAD (lets modules built elsewhere be forced in)"
        type: boolean
        default: false
      clang_url:
        description: "Optional URL of a clang .tar.gz/.tar.xz with bin/clang (e.g. Android clang-r383902). Empty = Ubuntu clang-11"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-11 lld-11 llvm-11 gcc-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev cpio python3 device-tree-compiler

      - name: Fetch custom clang (optional)
        if: ${{ inputs.clang_url != '' }}
        run: |
          mkdir -p "$HOME/clang"
          curl -fL --retry 3 -o /tmp/clang.tar "${{ inputs.clang_url }}"
          tar -xf /tmp/clang.tar -C "$HOME/clang"
          bin=$(dirname "$(find "$HOME/clang" -name clang -path '*/bin/*' | head -n 1)")
          echo "CLANG_BIN=$bin" >> "$GITHUB_ENV"

      - name: Build
        env:
          LTO: ${{ inputs.lto && '1' || '0' }}
          FORCE_LOAD: ${{ inputs.force_load && '1' || '0' }}
        run: |
          if [ -z "${CLANG_BIN:-}" ]; then export CLANG_BIN=/usr/lib/llvm-11/bin; fi
          bash ci/build.sh

      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nashc-kernel
          path: dist/
          if-no-files-found: warn
